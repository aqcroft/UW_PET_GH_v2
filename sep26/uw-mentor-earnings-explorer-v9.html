<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Warehouse Mentor Earnings Explorer v9</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="mentorTool" src="uw-mentor-earnings-explorer-v2.html" title="Utility Warehouse Mentor Earnings Explorer v9"></iframe>
<script>
const frame=document.getElementById('mentorTool');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const v6=doc.createElement('script');
  v6.src='uw-mentor-v6-patch.js?v=6.0';
  v6.onload=()=>{
    const v9=doc.createElement('script');
    v9.src='uw-mentor-v9-splash-patch.js?v=9.0';
    v9.onload=()=>{try{doc.title='Utility Warehouse Mentor Earnings Explorer v9';}catch(e){}};
    doc.body.appendChild(v9);
  };
  doc.body.appendChild(v6);
});
</script>
</body>
</html>
