<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The First 60 Days - Coaching Preview v22</title>
<link rel="stylesheet" href="uw-toolkit-theme.css">
<style>
  html,body{margin:0;min-height:100%;background:#f6f3fb}
  #explorerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f3fb;opacity:0;visibility:hidden;transition:opacity .2s ease;z-index:1}
  #explorerFrame.active{opacity:1;visibility:visible}
  #splashLayer{position:fixed;inset:0;z-index:1000;overflow:auto;background:#f6f3fb;opacity:1;transition:opacity .3s ease}
  #splashLayer.fade-out{opacity:0;pointer-events:none}
  #splashLayer.hidden{display:none}
  .splash-card{overflow:hidden}
  .splash-top h1{line-height:1.08;letter-spacing:-.018em;margin-bottom:.28rem}
  .splash-subtitle{margin:.15rem 0 0;text-align:center;font-weight:800;line-height:1.3;opacity:.9}
  .splash-lead{line-height:1.38;text-align:center;margin:.15rem 0 .8rem}
  .splash-lead span,.splash-lead strong{display:block}
  .splash-lead strong{margin:.08rem 0;font-weight:950}
  .service-cloud{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;width:100%!important;max-width:18rem;gap:.58rem!important;margin:.3rem auto .9rem!important}
  .service-cloud span{display:flex!important;align-items:center!important;justify-content:center!important;min-height:2.65rem;padding:.58rem .72rem!important;text-align:center}
  .final-splash-note{margin:.28rem 0 .2rem;line-height:1.35}
  .splash-start{white-space:normal;line-height:1.18;padding:.82rem 1rem;margin-top:.72rem}
  .splash-start .remember-line{display:block;font-size:.78rem;font-weight:800;opacity:.9;margin-bottom:.18rem}
  .splash-start .win-line{display:block;font-size:1rem;font-weight:950}
  #recipientPreLayer{position:fixed;inset:0;z-index:2200;overflow:auto;background:#f6f3fb}
  #recipientPreLayer .recipient-pre-shell{width:100%;max-width:31rem;margin:0 auto;padding:16vh .85rem 2rem}
  #recipientPreLayer .recipient-pre-card{background:#fff;border-radius:1.05rem;box-shadow:0 20px 48px rgba(29,79,145,.12);overflow:hidden}
  #recipientPreLayer .recipient-pre-top{background:linear-gradient(145deg,#173c78,#147a4a);color:#fff;text-align:center;padding:1.35rem 1rem 1.15rem}
  #recipientPreLayer .recipient-pre-top h1{margin:0;font-size:1.85rem;line-height:1.08;font-weight:950;letter-spacing:-.018em}
  #recipientPreLayer .recipient-pre-body{padding:1.15rem 1rem 1rem;text-align:center}
  #recipientPreLayer .recipient-pre-body p{margin:.3rem 0 .9rem;font-size:1.03rem;line-height:1.48;color:#34303b}
  #recipientPreLayer .recipient-pre-btn{width:100%;min-height:3rem;border:0;border-radius:.72rem;background:linear-gradient(145deg,#1d4f91,#147a4a);color:#fff;font-weight:900;font-size:1rem;cursor:pointer;padding:0 1rem}
  @keyframes splashTapCue{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(38,22,79,0)}48%{transform:scale(1.025);box-shadow:0 0 0 .34rem rgba(38,22,79,.11)}}
  .splash-start{animation:splashTapCue 1.1s ease-in-out 2 6.5s both}
  .initial-onboarding-backdrop{position:fixed;inset:0;z-index:2000;background:transparent;opacity:1;pointer-events:none;transition:opacity .45s ease}
  .initial-onboarding-backdrop.fade-out{opacity:0}
  .initial-onboarding-popup{position:fixed;left:50%;transform:translateX(-50%);width:min(20.5rem,calc(100vw - 1.6rem));background:#eef6ff;border:1px solid #b8d4f2;border-radius:1.1rem;box-shadow:0 14px 36px rgba(21,38,68,.18);text-align:center;padding:.95rem 1.15rem}
  .walkthrough-intro-popup{width:min(16.5rem,calc(100vw - 2rem));padding:.88rem 1rem}
  .walkthrough-intro-popup .initial-onboarding-message{font-size:1.08rem;line-height:1.28}
  .initial-onboarding-message{margin:0;font-weight:800;line-height:1.38;color:#14233b;font-size:1rem}
  .initial-onboarding-message strong{font-weight:950}
  .initial-onboarding-pointer{font-size:1.9rem;line-height:1;margin-top:.48rem}
  @media(max-width:520px){.splash-card{margin-top:5vh!important}.splash-top{padding-bottom:.82rem!important}.splash-top h1{font-size:1.7rem!important;line-height:1.08}.splash-subtitle{font-size:.98rem}.splash-body{padding-top:1rem!important}.splash-lead{font-size:.98rem;margin-bottom:.72rem}.service-cloud{max-width:17rem;gap:.52rem!important;margin:.15rem auto .85rem!important}.service-cloud span{padding:.55rem .62rem!important}.initial-onboarding-popup{padding:.9rem 1rem}#recipientPreLayer .recipient-pre-shell{padding-top:16vh}#recipientPreLayer .recipient-pre-top h1{font-size:1.75rem}}
  @media(prefers-reduced-motion:reduce){.splash-start{animation:none!important}}
</style>
</head>
<body>
<iframe id="explorerFrame" title="The First 60 Days earnings explorer"></iframe>
<div id="splashLayer"><div class="app"><main class="shell"><section class="splash-card" style="margin-top:10vh"><div class="splash-top"><div class="splash-wave">👋</div><h1>Your first 60 days</h1><p class="splash-subtitle">A run-through of what you could earn</p></div><div class="splash-body"><p class="splash-lead"><span>Helping people save on</span><strong>essential home services</strong><span>they already use:</span></p><div class="service-cloud"><span>⚡ energy</span><span>🛜 broadband</span><span>📲 mobile</span><span>☔ insurance</span></div><p class="final-splash-note"><strong>Bundles build benefits for customers and Partners.</strong></p><button class="button splash-start" id="startButton" type="button"><span class="remember-line">Remember:</span><span class="win-line">🏆 Customers win, partners win 🏆</span></button></div></section></main></div></div>
<script>
const splash=document.getElementById('splashLayer');
const frame=document.getElementById('explorerFrame');
const startButton=document.getElementById('startButton');
const HOST_PARAMS=new URL(location.href).searchParams;
const WALKTHROUGH_DELAY=250,WALKTHROUGH_HOLD=2050,WALKTHROUGH_FADE=350,AUTO_COACH_HOLD=2600,AUTO_COACH_FADE=400;
const EXPLORER_BASE='earningstool-v9.html?coaching-preview=20260920a';
let launched=false,patchPromise=Promise.resolve();
let frameSession=0;

function safeFirstName(value){return String(value||'').trim().replace(/\s+/g,' ').split(' ')[0].slice(0,40);}
function personaliseRecipientSplash(){
  if(HOST_PARAMS.get('shared')!=='1')return;
  const name=safeFirstName(HOST_PARAMS.get('n'));
  const ctx=HOST_PARAMS.get('ctx')||'together';
  const copies={
    together:{message:'Have a play with the earnings tool we looked at.',button:'Take another look'},
    familiar:{message:'Here’s another way to look at how the UW Partner earnings can build.',button:'Take a look'},
    first:{message:'Here’s a simple way to explore how the UW Partner earnings can build over the first 60 days.',button:'Start exploring'}
  };
  const copy=copies[ctx]||copies.together;
  const layer=document.createElement('div');
  layer.id='recipientPreLayer';
  layer.innerHTML=`<div class="recipient-pre-shell"><section class="recipient-pre-card"><div class="recipient-pre-top"><h1>${name?`Hi ${name} 👋`:'Hi 👋'}</h1></div><div class="recipient-pre-body"><p>${copy.message}</p><button type="button" class="recipient-pre-btn">${copy.button}</button></div></section></div>`;
  layer.querySelector('.recipient-pre-btn').addEventListener('click',()=>layer.remove());
  document.body.appendChild(layer);
}

function freshExplorerUrl(){
  frameSession+=1;
  return `${EXPLORER_BASE}&session=${Date.now()}-${frameSession}`;
}

function resetToFreshExplorer(){
  launched=false;
  startButton.disabled=false;
  frame.classList.remove('active');
  frame.style.pointerEvents='none';
  splash.classList.remove('fade-out','hidden');
  patchPromise=Promise.resolve();
  frame.src=freshExplorerUrl();
}

function loadPatch(doc,src,key,value){return new Promise((resolve,reject)=>{if(doc.documentElement.dataset[key]===value){resolve();return;}const s=doc.createElement('script');s.src=src;s.onload=()=>{doc.documentElement.dataset[key]=value;resolve();};s.onerror=reject;doc.body.appendChild(s);});}

function installTopLevelMentorNavigation(doc){
  if(!doc||doc.documentElement.dataset.v21TopMentor==='1')return;
  doc.documentElement.dataset.v21TopMentor='1';
  doc.addEventListener('click',event=>{
    const link=event.target.closest?.('a[href]');
    if(!link)return;
    const text=(link.textContent||'').replace(/\s+/g,' ').trim();
    const href=link.getAttribute('href')||'';
    const isMentor=link.classList.contains('sneaky-mentor-shortcut')||/mentor/i.test(text)||/mentor/i.test(href);
    if(!isMentor)return;
    const target=new URL(link.href,doc.baseURI).href;
    event.preventDefault();
    event.stopImmediatePropagation();
    window.location.assign(target);
  },true);
}

async function installExplorerPatches(){try{const doc=frame.contentDocument;if(!doc||!doc.documentElement||!doc.body)return;installTopLevelMentorNavigation(doc);await loadPatch(doc,'uw-explorer-v10-criteria-fade-patch.js?20260908a','explorerCriteriaFadePatch','v10');await loadPatch(doc,'uw-explorer-coaching-preview-v9.js?20260910b','coachingPreviewV9Loader','v9');await loadPatch(doc,'uw-explorer-coaching-preview-v12-refinement.js?20260910e','coachingPreviewV12RefinementLoader','v12-refinement');await loadPatch(doc,'uw-explorer-coaching-preview-v21-timing.js?20260917a','coachingPreviewV21TimingLoader','v21-timing');await loadPatch(doc,'uw-explorer-coaching-preview-v16-refinement.js?20260910i','coachingPreviewV16RefinementLoader','v16-refinement');await loadPatch(doc,'uw-explorer-coaching-preview-v18-flow.js?20260910k','coachingPreviewV18FlowLoader','v18-flow');await loadPatch(doc,'uw-explorer-coaching-preview-v19-polish.js?20260910l','coachingPreviewV19PolishLoader','v19-polish');await loadPatch(doc,'uw-explorer-coaching-preview-v20-polish.js?20260910m','coachingPreviewV20PolishLoader','v20-polish');await loadPatch(doc,'uw-explorer-v21-contact-share.js?20260917a','v21ContactShareLoader','v21-contact-share');await loadPatch(doc,'uw-explorer-coaching-preview-v22-ux.js?20260920l','coachingPreviewV22UxLoader','v22-ux');installTopLevelMentorNavigation(doc);frame.contentWindow.CoachingPreviewV12?.setInitialReady(false);}catch(error){console.error('Coaching preview v22 patch failed to load:',error);}}

frame.addEventListener('load',()=>{patchPromise=installExplorerPatches();});

function positionInitialCoach(popup){try{const button=frame.contentDocument?.querySelector('.add-customer-main:not([disabled])')||frame.contentDocument?.querySelector('.add-customer-main');const rect=button?.getBoundingClientRect();const height=popup.offsetHeight||88;let top=rect?rect.top-height-14:window.innerHeight-height-150;top=Math.max(110,Math.min(top,window.innerHeight-height-76));popup.style.top=`${Math.round(top)}px`;}catch(error){popup.style.top='58%';}}
function positionWalkthroughCoach(popup){try{const button=frame.contentDocument?.querySelector('.add-customer-main:not([disabled])')||frame.contentDocument?.querySelector('.add-customer-main');const rect=button?.getBoundingClientRect();const height=popup.offsetHeight||72;let top=rect?rect.top-height-105:window.innerHeight-height-245;top=Math.max(90,Math.min(top,window.innerHeight-height-150));popup.style.top=`${Math.round(top)}px`;}catch(error){popup.style.top='46%';}}
function showInitialOnboarding(){const overlay=document.createElement('div');overlay.className='initial-onboarding-backdrop';overlay.setAttribute('role','status');overlay.setAttribute('aria-live','polite');overlay.innerHTML=`<section class="initial-onboarding-popup"><p class="initial-onboarding-message">Tap <strong>“Add 1st customer”</strong><br>to see your income build.</p></section>`;document.body.appendChild(overlay);const popup=overlay.querySelector('.initial-onboarding-popup');requestAnimationFrame(()=>positionInitialCoach(popup));window.setTimeout(()=>positionInitialCoach(popup),120);window.setTimeout(()=>overlay.classList.add('fade-out'),AUTO_COACH_HOLD);window.setTimeout(()=>{overlay.remove();frame.style.pointerEvents='auto';try{frame.contentWindow.CoachingPreviewV12?.activateFirstAction();}catch(error){}},AUTO_COACH_HOLD+AUTO_COACH_FADE);}
function showWalkthroughIntro(){const overlay=document.createElement('div');overlay.className='initial-onboarding-backdrop';overlay.setAttribute('role','status');overlay.setAttribute('aria-live','polite');overlay.innerHTML=`<section class="initial-onboarding-popup walkthrough-intro-popup"><p class="initial-onboarding-message">Let’s walk you<br>through it</p></section>`;document.body.appendChild(overlay);const popup=overlay.querySelector('.walkthrough-intro-popup');requestAnimationFrame(()=>positionWalkthroughCoach(popup));window.setTimeout(()=>positionWalkthroughCoach(popup),120);window.setTimeout(()=>overlay.classList.add('fade-out'),WALKTHROUGH_HOLD);window.setTimeout(()=>{overlay.remove();showInitialOnboarding();},WALKTHROUGH_HOLD+WALKTHROUGH_FADE);}
async function launchExplorer(){if(launched)return;launched=true;startButton.disabled=true;frame.style.pointerEvents='none';frame.classList.add('active');splash.classList.add('fade-out');window.setTimeout(async()=>{splash.classList.add('hidden');await patchPromise;frame.contentWindow.CoachingPreviewV12?.setInitialReady(false);window.setTimeout(showWalkthroughIntro,WALKTHROUGH_DELAY);},320);}
startButton.addEventListener('click',launchExplorer);

window.addEventListener('pageshow',event=>{
  if(event.persisted)resetToFreshExplorer();
});

personaliseRecipientSplash();
resetToFreshExplorer();
</script>
</body>
</html>
