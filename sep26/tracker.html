<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UW First 60 Days Tracker</title>
<link rel="stylesheet" href="uw-toolkit-theme.css">
</head>
<body>
<div class="app">
  <main class="shell" id="app"></main>
  <div id="nav"></div>
  <div id="sheet"></div>
</div>
<script src="uw-earnings-rules.js"></script>
<script>
const R=window.UWEarningsRules;
const storeKey='uw-first-60-tracker-v2';
const money=(value)=>`£${Math.round(value||0).toLocaleString()}`;
function todayISO(){
  const now=new Date();
  const local=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
const icon=(type)=>type==='tenant'?'🔑':'🏡';
const label=(type)=>type==='tenant'?'Tenant':'Homeowner';
const emptyCustomers=()=>Array.from({length:10},(_,i)=>({id:`t${i+1}`,dateGathered:'',type:'',services:4,supported:i<6}));
let state=loadState();
let editor=null;

function loadState(){
  const fallback={view:'home',startDate:todayISO(),partnerIntroduced:false,introducedPartnerDate:todayISO(),ownAccount:false,ownAccountDate:todayISO(),customers:emptyCustomers(),helpCount:0,helpFastStart:true};
  try{return {...fallback,...JSON.parse(localStorage.getItem(storeKey)||'{}')};}catch(e){return fallback;}
}
function saveState(){localStorage.setItem(storeKey,JSON.stringify(state));}
function setView(view){state.view=view;saveState();render();}
function getResult(){
  return R.calculateEarnings({
    startDate:state.startDate,
    partnerIntroduced:state.partnerIntroduced,
    introducedPartnerDate:state.introducedPartnerDate,
    ownAccountQualifiesForFastStart:state.ownAccount,
    ownAccountDate:state.ownAccountDate,
    gatheredCustomers:state.customers.filter(c=>c.type&&c.dateGathered),
  });
}
function dayOfJourney(){
  const day=R.getJourneyDay(state.startDate,todayISO())||1;
  return Math.max(1,Math.min(60,day));
}
function nextCustomerIndex(){
  const index=state.customers.findIndex(c=>!c.type||!c.dateGathered);
  return index<0?9:index;
}
function suggestedSupport(index,date){
  const day=R.getJourneyDay(state.startDate,date)||1;
  return day<=30&&index<6;
}
function coach(result){
  if(result.customers.length===0)return 'Add your first customer to start tracking your first 60 days.';
  if(result.customers.length>=10)return 'Your first 10 are complete. The next chapter is helping another Partner win early.';
  const hab=Object.entries(result.hab.months).find(([,m])=>m.qualifyingCount===3&&!m.unlocked);
  if(hab)return 'Just one more 3+ service homeowner this calendar month could start your High Activity Bonus. One customer could be worth up to £700.';
  if(result.customers.length>=5&&!result.qd.achievedWithin30)return 'Your first five customers are in. Add your own UW account and customer-to-Partner step in Settings to complete Fast Start.';
  if(result.qd.achievedWithin30&&result.customers.length<7)return 'Fast Start is in place. Your 7th solo 3+ service customer is where early Momentum can begin.';
  if(result.customers.length>=6&&todayISO()<R.MOMENTUM_EFFECTIVE_DATE)return 'Momentum starts on 1 Sep 2026. From then, solo 3+ service customers can qualify.';
  if(result.customers.length>=6)return 'Your next solo 3+ service customer could add Momentum.';
  return `${6-result.customers.length} more customer${6-result.customers.length===1?'':'s'} to reach the first 30 days target.`;
}
function openCustomer(index=nextCustomerIndex()){
  const c=state.customers[index];
  const date=c.dateGathered||todayISO();
  editor={index,draft:{...c,dateGathered:date,type:c.type||'homeowner',services:c.services||4,supported:c.type?c.supported:suggestedSupport(index,date)}};
  renderSheet();
}
function closeSheet(){editor=null;renderSheet();}
function setDraft(field,value){editor.draft[field]=value;renderSheet();}
function toggleDateEdit(){editor.showDateEdit=!editor.showDateEdit;renderSheet();}
function saveCustomer(){
  state.customers=state.customers.map((c,i)=>i===editor.index?{...editor.draft,id:c.id}:c);
  saveState();
  closeSheet();
  render();
}
function clearCustomer(index){
  state.customers=state.customers.map((c,i)=>i===index?{id:c.id,dateGathered:'',type:'',services:4,supported:i<6}:c);
  saveState();
  render();
}
function resetTracker(){
  state={view:'home',startDate:todayISO(),partnerIntroduced:false,introducedPartnerDate:todayISO(),ownAccount:false,ownAccountDate:todayISO(),customers:emptyCustomers(),helpCount:0,helpFastStart:true};
  saveState();
  render();
}
function setField(field,value){state[field]=value;saveState();render();}
function adjustHelp(delta){state.helpCount=Math.max(0,Math.min(10,state.helpCount+delta));saveState();render();}
function toggleHelpFastStart(){state.helpFastStart=!state.helpFastStart;saveState();render();}
function momentumMessage(row){
  if(!row)return '';
  const services=Number(row.services);
  const isCustomerType=row.type==='homeowner'||row.type==='tenant';
  if(row.momentumGatheringPartner>0)return 'Momentum +£125 included.';
  if(!isCustomerType)return '';
  if(services<3)return 'Momentum needs 3+ services.';
  if(row.supported)return 'Support means no Momentum on this customer.';
  if(row.dateGathered<R.MOMENTUM_EFFECTIVE_DATE)return 'Momentum starts on 1 Sep 2026.';
  if(row.journeyDay===null||row.journeyDay<1)return 'Momentum starts once the 60-day journey begins.';
  if(row.journeyDay>60)return 'Momentum only applies through day 60.';
  if(row.journeyDay<=30&&row.customerNumber<=6)return 'Momentum can start from Customer 7 in the first 30 days.';
  if(row.customerNumber>R.MOMENTUM_MAX_GATHERED_CUSTOMER_NUMBER)return 'Momentum is capped at Customer 10.';
  return '';
}
function momentumChip(row){
  if(!row)return '';
  if(row.momentumGatheringPartner>0)return '<span class="chip">Momentum +£125</span>';
  if(row.supported||Number(row.services)<3)return '';
  if(row.dateGathered<R.MOMENTUM_EFFECTIVE_DATE)return '<span class="chip">Momentum from 1 Sep</span>';
  if(row.journeyDay<=30&&row.customerNumber<=6)return '<span class="chip">Momentum from C7</span>';
  return '';
}

function helpResult(){
  const start='2026-09-01';
  const gathered=Array.from({length:state.helpCount},(_,i)=>({
    id:`h${i+1}`,
    type:'homeowner',
    services:4,
    supported:i<5,
    dateGathered:R.addDays(start,i<5?i+1:30+i-4),
  }));
  return R.calculateEarnings({
    startDate:start,
    ownAccountQualifiesForFastStart:state.helpFastStart&&state.helpCount>=5,
    ownAccountDate:start,
    partnerIntroduced:state.helpFastStart&&state.helpCount>=5,
    introducedPartnerDate:R.addDays(start,19),
    gatheredCustomers:gathered,
  });
}
function rowTotal(row){return row.customerBonusGatheringPartner+row.highActivityBonus+row.momentumGatheringPartner;}
function renderNav(){
  const items=[['home','Home'],['customers','Customers'],['help','Help']];
  document.getElementById('nav').innerHTML=`<nav class="bottom-nav"><div class="bottom-nav-inner" style="grid-template-columns:repeat(${items.length},1fr)">
    ${items.map(([id,text])=>`<button class="nav-button ${state.view===id?'active':''}" onclick="setView('${id}')">${text}</button>`).join('')}
  </div></nav>`;
}
function renderHome(result){
  return `<header class="topbar">
    <div><div class="eyebrow">First 60 days</div><h1>Day ${dayOfJourney()} of 60</h1></div>
    <a class="button secondary" style="display:grid;place-items:center;text-decoration:none;padding:0 .8rem" href="earningstool.html">Explorer</a>
  </header>
  <section class="hero">
    <div class="eyebrow" style="color:rgba(255,255,255,.76)">Your earnings so far</div>
    <div class="hero-number">${money(result.gatheringBreakdown.total)}</div>
    <div class="hero-sub">${coach(result)}</div>
  </section>
  <section class="card">
    <div class="row" style="margin-bottom:.55rem"><strong>${result.customers.length} of 10 customers</strong><strong>${10-result.customers.length} left</strong></div>
    <div class="progress"><span style="width:${Math.min(100,result.customers.length*10)}%"></span></div>
    <button class="button" style="margin-top:.9rem" onclick="openCustomer()">Add customer</button>
  </section>
  <section class="metric-grid">
    <div class="metric"><div class="eyebrow">Fast Start</div><strong>${result.qd.achievedWithin30?'Achieved':'In progress'}</strong></div>
    <div class="metric"><div class="eyebrow">Momentum</div><strong>${money(result.gatheringBreakdown.momentumBonus)}</strong></div>
  </section>
  ${renderEarningsBreakdown(result)}
  ${renderTrackerSettings()}`;
}
function renderCustomers(result){
  const rowsById=result.customers.reduce((acc,row)=>{acc[row.id]=row;return acc;},{});
  return `<header class="topbar"><div><div class="eyebrow">Tracker</div><h1>Customers</h1></div><button class="button secondary" onclick="openCustomer()" style="width:auto">Add</button></header>
  <section class="card list">
    ${state.customers.map((c,i)=>{
      const row=rowsById[c.id];
      const total=row?rowTotal(row):0;
      const chips=row?momentumChip(row):'';
      return `<button class="list-button" onclick="openCustomer(${i})">
        <div class="row">
          <div class="customer-titleline"><strong>${row?`${icon(row.type)} Customer ${row.customerNumber}`:`Customer ${i+1}`}</strong>${row&&row.supported?'<span class="chip amber">Supported</span>':''}</div>
          <strong>${row?money(total):'Add'}</strong>
        </div>
        <div class="muted" style="margin-top:.25rem;font-size:.88rem">${row?`${row.dateGathered===todayISO()?'Today':row.dateGathered} · ${label(row.type)} · ${row.services} services`:'Tap to record this customer'}</div>
        ${row?`<div class="customer-payment-grid">
          ${paymentCell('Customer',row.customerBonusGatheringPartner)}
          ${paymentCell('High activity',row.highActivityBonus)}
          ${paymentCell('Momentum',row.momentumGatheringPartner)}
          ${paymentCell('Ongoing',residualEstimate(row),'residual')}
          ${paymentCell('Total',total,'total')}
        </div>`:''}
        ${chips?`<div class="chip-row">${chips}</div>`:''}
      </button>`;
    }).join('')}
  </section>`;
}
function line(label,value){return `<div class="row muted"><span>${label}</span><strong>${money(value)}</strong></div>`;}
function formatPayment(value){return typeof value==='number'?money(value):value;}
function residualEstimate(row){
  if(row.type==='tenant')return '£2-£3/mo';
  if(row.type==='homeowner')return '£3-£5/mo';
  return '-';
}
function paymentCell(label,value,tone=''){
  return `<div class="payment-cell ${tone}"><span>${label}</span><strong>${formatPayment(value)}</strong></div>`;
}
function renderEarningsBreakdown(result){
  return `<section class="card">
    <div class="row"><h2>You</h2><strong>${money(result.gatheringBreakdown.total)}</strong></div>
    <div class="divider"></div>
    ${line('Customer earnings',result.gatheringBreakdown.customerBonus)}
    ${line('High Activity Bonus',result.gatheringBreakdown.highActivityBonus)}
    ${line('QD* bonus',result.gatheringBreakdown.qdBonus)}
    ${line('Fast Starter bonus',result.gatheringBreakdown.fastStarterBonus)}
    ${line('Momentum',result.gatheringBreakdown.momentumBonus)}
  </section>`;
}
function renderTrackerSettings(){
  return `<section class="card">
    <h2 style="margin-bottom:.7rem">Settings</h2>
    <label><div class="eyebrow">Registration date</div><input class="input" type="date" value="${state.startDate}" onchange="setField('startDate',this.value)"></label>
    <button class="button secondary" style="width:100%;margin-top:.65rem" onclick="setField('partnerIntroduced',${!state.partnerIntroduced})">Partner introduced: ${state.partnerIntroduced?'yes':'no'}</button>
    ${state.partnerIntroduced?`<label style="display:block;margin-top:.65rem"><div class="eyebrow">Introduced date</div><input class="input" type="date" value="${state.introducedPartnerDate}" onchange="setField('introducedPartnerDate',this.value)"></label>`:''}
    <button class="button secondary" style="width:100%;margin-top:.65rem" onclick="setField('ownAccount',${!state.ownAccount})">Own UW account: ${state.ownAccount?'yes':'no'}</button>
    ${state.ownAccount?`<label style="display:block;margin-top:.65rem"><div class="eyebrow">Own account date</div><input class="input" type="date" value="${state.ownAccountDate}" onchange="setField('ownAccountDate',this.value)"></label>`:''}
    <button class="button secondary" style="width:100%;margin-top:.75rem;color:var(--red)" onclick="resetTracker()">Reset tracker</button>
  </section>`;
}
function renderHelp(result){
  const unlocked=result.customers.length>=10;
  if(!unlocked)return `<header class="topbar"><div><div class="eyebrow">New chapter</div><h1>Help a Partner</h1></div></header>
    <section class="hero hero-cream">
      <div class="eyebrow">Locked for now</div>
      <h1>Finish your first 10 customers</h1>
      <p class="muted">Once your own first-60-days journey is complete, this opens the mentor and support income story.</p>
      <button class="button" onclick="setView('customers')">View customers</button>
    </section>`;
  const hr=helpResult();
  return `<header class="topbar"><div><div class="eyebrow">Unlocked</div><h1>Help a Partner</h1></div></header>
    <section class="hero">
      <div class="eyebrow" style="color:rgba(255,255,255,.76)">Your mentor/support income</div>
      <div class="hero-number">${money(hr.recruiterBreakdown.total)}</div>
      <div class="hero-sub">A simple demo of helping one new Partner build their first 60 days.</div>
    </section>
    <section class="card">
      <div class="row" style="margin-bottom:.6rem"><h2>Their progress</h2><strong>${state.helpCount}/10</strong></div>
      <div class="progress"><span style="width:${state.helpCount*10}%"></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.8rem">
        <button class="button secondary" onclick="adjustHelp(-1)">Remove one</button>
        <button class="button" onclick="adjustHelp(1)">Add one</button>
      </div>
      <button class="button ${state.helpFastStart?'cream':'secondary'}" style="width:100%;margin-top:.55rem" onclick="toggleHelpFastStart()">Fast Start: ${state.helpFastStart?'included':'off'}</button>
    </section>
    <section class="card">
      <div class="row"><h2>Breakdown</h2><strong>${money(hr.recruiterBreakdown.total)}</strong></div>
      <div class="divider"></div>
      ${line('Supporting bonus',hr.recruiterBreakdown.supportingCustomerBonus)}
      ${line('QD mentor bonus',hr.recruiterBreakdown.qdMentorBonus)}
      ${line('Fast Starter mentor bonus',hr.recruiterBreakdown.fastStarterMentorBonus)}
      ${line('Mentor Momentum',hr.recruiterBreakdown.momentumBonus)}
    </section>`;
}
function renderSheet(){
  if(!editor){document.getElementById('sheet').innerHTML='';return;}
  const d=editor.draft;
  const previewCustomers=state.customers.map((c,i)=>i===editor.index?{...d,id:c.id}:c).filter(c=>c.type&&c.dateGathered);
  const preview=R.calculateEarnings({startDate:state.startDate,partnerIntroduced:state.partnerIntroduced,introducedPartnerDate:state.introducedPartnerDate,ownAccountQualifiesForFastStart:state.ownAccount,ownAccountDate:state.ownAccountDate,gatheredCustomers:previewCustomers}).customers.find(c=>c.id===d.id);
  const total=preview?rowTotal(preview):0;
  const momentumText=momentumMessage(preview);
  const momentumClass=preview&&preview.momentumGatheringPartner>0?'momentum-note positive':'momentum-note';
  document.getElementById('sheet').innerHTML=`<div class="sheet-backdrop" onclick="closeSheet()">
    <section class="sheet" onclick="event.stopPropagation()">
      <div class="row" style="margin-bottom:.75rem">
        <h2>Customer ${editor.index+1}</h2>
        <div style="display:flex;align-items:center;gap:.45rem">
          <button class="sheet-close" onclick="closeSheet()">×</button>
          <button class="button" style="width:auto;min-height:2.25rem;padding:0 .8rem" onclick="saveCustomer()">Confirm</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:.65rem">
        <button class="button secondary" style="width:auto;min-height:2.45rem" onclick="toggleDateEdit()">Change date</button>
        <button class="button ${d.dateGathered===todayISO()?'cream':'secondary'}" style="width:auto;min-height:2.45rem" onclick="${d.dateGathered===todayISO()?'toggleDateEdit()':`setDraft('dateGathered','${todayISO()}')`}">${d.dateGathered===todayISO()?'Today':d.dateGathered}</button>
      </div>
      ${editor.showDateEdit?`<div style="margin-bottom:.7rem">
        <input class="input" type="date" value="${d.dateGathered}" onchange="setDraft('dateGathered',this.value)">
        <p class="muted" style="font-size:.8rem">Dates keep monthly bonuses and the 60-day window accurate. If you record customers as you go, leave this as Today.</p>
      </div>`:''}
      <div class="eyebrow">Home</div>
      <div class="segmented two" style="margin:.35rem 0 .7rem">
        <button class="segment ${d.type==='homeowner'?'active':''}" onclick="setDraft('type','homeowner')">🏡 Homeowner</button>
        <button class="segment ${d.type==='tenant'?'active':''}" onclick="setDraft('type','tenant')">🔑 Tenant</button>
      </div>
      <div class="eyebrow">Services</div>
      <div class="segmented four" style="margin:.35rem 0 .75rem">
        ${[1,2,3,4].map(n=>`<button class="segment ${Number(d.services)===n?'active':''}" onclick="setDraft('services',${n})">${n}</button>`).join('')}
      </div>
      <div class="eyebrow">Support</div>
      <div class="segmented two" style="margin:.35rem 0 .55rem">
        <button class="segment ${!d.supported?'active':''}" onclick="setDraft('supported',false)">Solo</button>
        <button class="segment ${d.supported?'active':''}" onclick="setDraft('supported',true)">Supported</button>
      </div>
      ${momentumText?`<p class="${momentumClass}">${momentumText}</p>`:''}
      <div class="row" style="margin-top:.75rem;padding:.7rem;background:#f7f4fb;border-radius:.65rem"><span style="font-weight:900">Earnings</span><strong>${money(total)}</strong></div>
      ${state.customers[editor.index].type?`<button class="button secondary" style="width:100%;margin-top:.5rem;color:var(--red)" onclick="clearCustomer(${editor.index});closeSheet()">Clear customer</button>`:''}
    </section>
  </div>`;
}
function render(){
  const result=getResult();
  const app=document.getElementById('app');
  if(state.view==='earnings'){state.view='home';saveState();}
  if(state.view==='customers')app.innerHTML=renderCustomers(result);
  else if(state.view==='help')app.innerHTML=renderHelp(result);
  else app.innerHTML=renderHome(result);
  renderNav();
  renderSheet();
}
render();
</script>
</body>
</html>
