<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Warehouse Mentor Earnings Explorer v10</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="mentorTool" src="uw-mentor-earnings-explorer-v2.html" title="Utility Warehouse Mentor Earnings Explorer v10"></iframe>
<script>
const frame=document.getElementById('mentorTool');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const scripts=[
    'uw-mentor-v6-patch.js?v=6.0',
    'uw-mentor-v9-splash-patch.js?v=9.0',
    'uw-mentor-v10-final-patch.js?v=10.0'
  ];
  const loadNext=(index)=>{
    if(index>=scripts.length){try{doc.title='Utility Warehouse Mentor Earnings Explorer v10';}catch(e){}return;}
    const s=doc.createElement('script');
    s.src=scripts[index];
    s.onload=()=>loadNext(index+1);
    doc.body.appendChild(s);
  };
  loadNext(0);
});
</script>
</body>
</html>
