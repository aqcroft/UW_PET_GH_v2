<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The First 60 Days - Coaching Preview</title>
<link rel="stylesheet" href="uw-toolkit-theme.css">
<style>
  html,body{margin:0;min-height:100%;background:#f6f3fb}

  #explorerFrame{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    background:#f6f3fb;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s ease;
    z-index:1;
  }
  #explorerFrame.active{opacity:1;visibility:visible}

  #splashLayer{
    position:fixed;
    inset:0;
    z-index:1000;
    overflow:auto;
    background:#f6f3fb;
    opacity:1;
    transition:opacity .3s ease;
  }
  #splashLayer.fade-out{opacity:0;pointer-events:none}
  #splashLayer.hidden{display:none}

  .splash-card{overflow:hidden}
  .splash-top h1{line-height:1.13;letter-spacing:-.018em;margin-bottom:.15rem}
  .splash-title-line{display:block}
  .splash-lead{line-height:1.38;text-align:center;margin:.15rem 0 .8rem}
  .splash-lead span,.splash-lead strong{display:block}
  .splash-lead strong{margin:.08rem 0;font-weight:950}
  .service-cloud{gap:.6rem .72rem!important;margin:.3rem 0 .9rem!important}
  .service-cloud span{padding:.58rem .72rem!important}
  .final-splash-note{margin:.28rem 0 .2rem;line-height:1.35}
  .splash-start{white-space:normal;line-height:1.18;padding:.82rem 1rem;margin-top:.72rem}
  .splash-start .remember-line{display:block;font-size:.78rem;font-weight:800;opacity:.9;margin-bottom:.18rem}
  .splash-start .win-line{display:block;font-size:1rem;font-weight:950}

  .initial-onboarding-backdrop{
    position:fixed;
    inset:0;
    z-index:2000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1rem;
    background:rgba(30,37,54,.36);
    opacity:1;
    transition:opacity .55s ease;
  }
  .initial-onboarding-backdrop.fade-out{opacity:0;pointer-events:none}
  .initial-onboarding-popup{
    width:min(20.5rem,calc(100vw - 2rem));
    background:#eef6ff;
    border:1px solid #b8d4f2;
    border-radius:1.1rem;
    box-shadow:0 18px 50px rgba(21,38,68,.2);
    text-align:center;
    padding:1.45rem 1.35rem;
  }
  .initial-onboarding-wave{font-size:2rem;line-height:1;margin-bottom:.55rem}
  .initial-onboarding-message{margin:0;font-weight:800;line-height:1.42;color:#14233b;font-size:1rem}
  .initial-onboarding-message strong{font-weight:950}
  .initial-onboarding-message .coach-line{display:block;margin-top:.34rem;font-weight:750}

  @media(max-width:520px){
    .splash-card{margin-top:5vh!important}
    .splash-top{padding-bottom:.82rem!important}
    .splash-top h1{font-size:1.55rem!important;line-height:1.14}
    .splash-body{padding-top:1rem!important}
    .splash-lead{font-size:.98rem;margin-bottom:.72rem}
    .service-cloud{gap:.52rem!important;margin:.15rem 0 .85rem!important}
    .service-cloud span{padding:.55rem .62rem!important}
    .initial-onboarding-popup{padding:1.35rem 1.05rem}
  }
</style>
</head>
<body>

<!-- Isolated coaching preview. Live earningstool-vfinal.html and earningstool-v9.html remain untouched. -->
<iframe id="explorerFrame" src="earningstool-v9.html?coaching-preview=20260909b" title="The First 60 Days earnings explorer"></iframe>

<div id="splashLayer">
  <div class="app">
    <main class="shell">
      <section class="splash-card" style="margin-top:10vh">
        <div class="splash-top">
          <div class="splash-wave">👋</div>
          <h1>
            <span class="splash-title-line">What could your first 60 days</span>
            <span class="splash-title-line">as a Utility Warehouse</span>
            <span class="splash-title-line">Authorised Partner look like?</span>
          </h1>
        </div>
        <div class="splash-body">
          <p class="splash-lead">
            <span>We help people save on</span>
            <strong>essential home services</strong>
            <span>they already use:</span>
          </p>
          <div class="service-cloud">
            <span>⚡ energy</span>
            <span>🛜 broadband</span>
            <span>📲 mobile</span>
            <span>☔ insurance</span>
          </div>
          <p class="final-splash-note"><strong>Bundles build benefits for customers and Partners.</strong></p>
          <button class="button splash-start" id="startButton" type="button">
            <span class="remember-line">Remember:</span>
            <span class="win-line">🏆 Customers win, partners win 🏆</span>
          </button>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
const splash=document.getElementById('splashLayer');
const frame=document.getElementById('explorerFrame');
const startButton=document.getElementById('startButton');
let launched=false;

function loadPatch(doc,src,markerKey,markerValue){
  return new Promise((resolve,reject)=>{
    if(doc.documentElement.dataset[markerKey]===markerValue){resolve();return;}
    const script=doc.createElement('script');
    script.src=src;
    script.onload=()=>{doc.documentElement.dataset[markerKey]=markerValue;resolve();};
    script.onerror=reject;
    doc.body.appendChild(script);
  });
}

async function installExplorerPatches(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement||!doc.body)return;
    await loadPatch(doc,'uw-explorer-v10-criteria-fade-patch.js?20260908a','explorerCriteriaFadePatch','v10');
    await loadPatch(doc,'uw-explorer-coaching-preview-v1.js?20260909b','coachingPreviewPatchLoader','v1');
  }catch(error){
    console.error('Coaching preview patch failed to load:',error);
  }
}

frame.addEventListener('load',installExplorerPatches);
if(frame.contentDocument&&frame.contentDocument.readyState==='complete')installExplorerPatches();

function showInitialOnboarding(){
  const overlay=document.createElement('div');
  overlay.className='initial-onboarding-backdrop';
  overlay.setAttribute('role','status');
  overlay.setAttribute('aria-live','polite');
  overlay.innerHTML=`
    <section class="initial-onboarding-popup">
      <div class="initial-onboarding-wave">👋</div>
      <p class="initial-onboarding-message">
        <strong>Start with your first customer</strong>
        <span class="coach-line">Tap <strong>Add 1st customer</strong> and watch the earnings build.</span>
      </p>
    </section>`;
  document.body.appendChild(overlay);

  window.setTimeout(()=>overlay.classList.add('fade-out'),6500);
  window.setTimeout(()=>{
    overlay.remove();
    try{frame.contentWindow.CoachingPreview?.pulseFirstAction();}catch(error){}
  },7080);
}

function launchExplorer(){
  if(launched)return;
  launched=true;
  startButton.disabled=true;

  frame.classList.add('active');
  splash.classList.add('fade-out');

  window.setTimeout(()=>{
    splash.classList.add('hidden');
    showInitialOnboarding();
  },320);
}

startButton.addEventListener('click',launchExplorer);
</script>
</body>
</html>
