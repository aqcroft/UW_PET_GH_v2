<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The First 60 Days - Coaching Preview v3</title>
<link rel="stylesheet" href="uw-toolkit-theme.css">
<style>
  html,body{margin:0;min-height:100%;background:#f6f3fb}
  #explorerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f3fb;opacity:0;visibility:hidden;transition:opacity .2s ease;z-index:1}
  #explorerFrame.active{opacity:1;visibility:visible}
  #splashLayer{position:fixed;inset:0;z-index:1000;overflow:auto;background:#f6f3fb;opacity:1;transition:opacity .3s ease}
  #splashLayer.fade-out{opacity:0;pointer-events:none}
  #splashLayer.hidden{display:none}

  .splash-card{overflow:hidden}
  .splash-top h1{line-height:1.08;letter-spacing:-.018em;margin-bottom:.28rem}
  .splash-subtitle{margin:.15rem 0 0;text-align:center;font-weight:800;line-height:1.3;opacity:.9}
  .splash-lead{line-height:1.38;text-align:center;margin:.15rem 0 .8rem}
  .splash-lead span,.splash-lead strong{display:block}
  .splash-lead strong{margin:.08rem 0;font-weight:950}
  .service-cloud{display:flex!important;flex-wrap:wrap!important;justify-content:center!important;align-items:center!important;align-content:center!important;width:100%!important;max-width:22rem;gap:.6rem .72rem!important;margin:.3rem auto .9rem!important}
  .service-cloud span{padding:.58rem .72rem!important}
  .final-splash-note{margin:.28rem 0 .2rem;line-height:1.35}
  .splash-start{white-space:normal;line-height:1.18;padding:.82rem 1rem;margin-top:.72rem}
  .splash-start .remember-line{display:block;font-size:.78rem;font-weight:800;opacity:.9;margin-bottom:.18rem}
  .splash-start .win-line{display:block;font-size:1rem;font-weight:950}

  @keyframes splashTapCue{
    0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(38,22,79,0)}
    48%{transform:scale(1.025);box-shadow:0 0 0 .34rem rgba(38,22,79,.11)}
  }
  .splash-start{animation:splashTapCue 1.1s ease-in-out 2 8s both}

  .initial-onboarding-backdrop{position:fixed;inset:0;z-index:2000;background:transparent;opacity:1;pointer-events:none;transition:opacity .45s ease}
  .initial-onboarding-backdrop.fade-out{opacity:0}
  .initial-onboarding-popup{position:fixed;left:50%;transform:translateX(-50%);width:min(20.5rem,calc(100vw - 1.6rem));background:#eef6ff;border:1px solid #b8d4f2;border-radius:1.1rem;box-shadow:0 14px 36px rgba(21,38,68,.18);text-align:center;padding:.95rem 1.15rem}
  .initial-onboarding-wave{font-size:1.8rem;line-height:1;margin-bottom:.38rem}
  .initial-onboarding-message{margin:0;font-weight:800;line-height:1.38;color:#14233b;font-size:1rem}
  .initial-onboarding-message strong{font-weight:950}

  @media(max-width:520px){
    .splash-card{margin-top:5vh!important}
    .splash-top{padding-bottom:.82rem!important}
    .splash-top h1{font-size:1.7rem!important;line-height:1.08}
    .splash-subtitle{font-size:.98rem}
    .splash-body{padding-top:1rem!important}
    .splash-lead{font-size:.98rem;margin-bottom:.72rem}
    .service-cloud{gap:.52rem!important;margin:.15rem auto .85rem!important}
    .service-cloud span{padding:.55rem .62rem!important}
    .initial-onboarding-popup{padding:.9rem 1rem}
  }
  @media(prefers-reduced-motion:reduce){.splash-start{animation:none!important}}
</style>
</head>
<body>

<!-- Isolated coaching preview v3. Live earningstool-vfinal.html, v9 and earlier previews remain untouched. -->
<iframe id="explorerFrame" src="earningstool-v9.html?coaching-preview=20260909e" title="The First 60 Days earnings explorer"></iframe>

<div id="splashLayer">
  <div class="app">
    <main class="shell">
      <section class="splash-card" style="margin-top:10vh">
        <div class="splash-top">
          <div class="splash-wave">👋</div>
          <h1>Your first 60 days</h1>
          <p class="splash-subtitle">A run-through of what you could earn</p>
        </div>
        <div class="splash-body">
          <p class="splash-lead"><span>We help people save on</span><strong>essential home services</strong><span>they already use:</span></p>
          <div class="service-cloud"><span>⚡ energy</span><span>🛜 broadband</span><span>📲 mobile</span><span>☔ insurance</span></div>
          <p class="final-splash-note"><strong>Bundles build benefits for customers and Partners.</strong></p>
          <button class="button splash-start" id="startButton" type="button">
            <span class="remember-line">Remember:</span>
            <span class="win-line">🏆 Customers win, partners win 🏆</span>
          </button>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
const splash=document.getElementById('splashLayer');
const frame=document.getElementById('explorerFrame');
const startButton=document.getElementById('startButton');
const AUTO_COACH_HOLD=4500;
const AUTO_COACH_FADE=450;
let launched=false;

function loadPatch(doc,src,markerKey,markerValue){
  return new Promise((resolve,reject)=>{
    if(doc.documentElement.dataset[markerKey]===markerValue){resolve();return;}
    const script=doc.createElement('script');
    script.src=src;
    script.onload=()=>{doc.documentElement.dataset[markerKey]=markerValue;resolve();};
    script.onerror=reject;
    doc.body.appendChild(script);
  });
}

async function installExplorerPatches(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement||!doc.body)return;
    await loadPatch(doc,'uw-explorer-v10-criteria-fade-patch.js?20260908a','explorerCriteriaFadePatch','v10');
    await loadPatch(doc,'uw-explorer-coaching-preview-v2.js?20260909d','coachingPreviewPatchLoader','v2');
    await loadPatch(doc,'uw-explorer-coaching-preview-v3.js?20260909e','coachingPreviewPatchV3Loader','v3');
    await loadPatch(doc,'uw-explorer-coaching-preview-v3-followup.js?20260909e','coachingPreviewV3FollowupLoader','v3');
    await loadPatch(doc,'uw-explorer-coaching-preview-v3-polish.js?20260909e','coachingPreviewV3PolishLoader','v3');
  }catch(error){console.error('Coaching preview v3 patch failed to load:',error);}
}

frame.addEventListener('load',installExplorerPatches);
if(frame.contentDocument&&frame.contentDocument.readyState==='complete')installExplorerPatches();

function positionInitialCoach(popup){
  try{
    const button=frame.contentDocument?.querySelector('.add-customer-main:not([disabled])');
    const rect=button?.getBoundingClientRect();
    const height=popup.offsetHeight||88;
    let top=rect?rect.top-height-14:window.innerHeight-height-150;
    top=Math.max(110,Math.min(top,window.innerHeight-height-76));
    popup.style.top=`${Math.round(top)}px`;
  }catch(error){popup.style.top='65%';}
}

function showInitialOnboarding(){
  const overlay=document.createElement('div');
  overlay.className='initial-onboarding-backdrop';
  overlay.setAttribute('role','status');
  overlay.setAttribute('aria-live','polite');
  overlay.innerHTML=`<section class="initial-onboarding-popup"><div class="initial-onboarding-wave">👇</div><p class="initial-onboarding-message">Tap <strong>“Add 1st customer”</strong> to watch your earnings build.</p></section>`;
  document.body.appendChild(overlay);
  const popup=overlay.querySelector('.initial-onboarding-popup');
  requestAnimationFrame(()=>positionInitialCoach(popup));
  window.setTimeout(()=>positionInitialCoach(popup),120);

  window.setTimeout(()=>overlay.classList.add('fade-out'),AUTO_COACH_HOLD);
  window.setTimeout(()=>{
    overlay.remove();
    try{frame.contentWindow.CoachingPreview?.pulseFirstAction();}catch(error){}
  },AUTO_COACH_HOLD+AUTO_COACH_FADE);
}

function launchExplorer(){
  if(launched)return;
  launched=true;
  startButton.disabled=true;
  frame.classList.add('active');
  splash.classList.add('fade-out');
  window.setTimeout(()=>{splash.classList.add('hidden');showInitialOnboarding();},320);
}

startButton.addEventListener('click',launchExplorer);
</script>
</body>
</html>
