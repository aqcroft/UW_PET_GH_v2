<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Warehouse Mentor Earnings Explorer v2</title>
<link rel="stylesheet" href="uw-toolkit-theme.css">
<style>
.add-customer-solo-row{display:flex;justify-content:center;margin:.45rem 0 0}
.add-customer-solo{width:58%;min-width:12rem;max-width:19rem;min-height:3.55rem}
.bonuses-row{display:grid;grid-template-columns:1fr 1fr;gap:.62rem;margin:0 0 .12rem}
.bonus-group{display:grid;grid-template-columns:1fr 1fr;gap:.38rem;min-width:0}
.bonus-group:last-child{grid-template-columns:1fr}
.bonus-badge{display:grid;justify-items:center;gap:.05rem;padding:.42rem .3rem;border-radius:.7rem;border:1px solid var(--line);background:#fff;text-align:center;min-width:0;line-height:1.04;transition:transform .3s ease,box-shadow .3s ease}
.bonus-ico{font-size:1.22rem;line-height:1}
.bonus-word{font-size:.58rem;font-weight:950;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.bonus-sub{font-size:.82rem;font-weight:950;white-space:nowrap}
.bonus-support{background:#e8f2ff;border-color:rgba(29,79,145,.28);color:var(--blue)}
.bonus-mentor{background:#fff4e0;border-color:rgba(201,142,32,.35);color:#b5730d}
.bonus-mentormom{background:#edf8f1;border-color:rgba(20,122,74,.3);color:var(--green)}
.bonus-badge.ghost{opacity:.4;filter:saturate(.5)}
.bonus-badge.pulse{transform:scale(1.08);box-shadow:0 0 0 4px rgba(201,142,32,.22)}
.customer-column{transition:opacity .55s ease,filter .55s ease}
.column-ghost-future{opacity:.4;filter:saturate(.55);pointer-events:none}
.column-ghost-complete{opacity:.62}
.customer-column-head{align-items:center}
.customer-summary-row{min-height:2.55rem}
.column-count{white-space:nowrap}
.row-badge{white-space:nowrap}
.row-badge.icon-only{font-size:1.3rem;line-height:1;padding:.15rem .3rem;min-width:2.05rem;text-align:center}
.column-head-left{display:grid;gap:.14rem;justify-items:start}
.column-head-left .column-count{margin:0}
.column-phase-title{font-size:.9rem;letter-spacing:.015em}
.column-total-blob{display:inline-block;font-size:1.18rem;font-weight:950;padding:.28rem .74rem;border-radius:999px;line-height:1.1;white-space:nowrap}
.customer-column-first .column-total-blob{color:var(--blue);background:#e8f2ff}
.customer-column-next .column-total-blob{color:var(--green);background:#edf8f1}
.mentor-hero-grid{align-items:start}
.mentor-hero-right{justify-items:end;text-align:right}
.hero-meta-stack{align-items:flex-end}
.hero-meta-pill,.own-account-title-badge{justify-self:end}
.own-account-title-badge.ghost{opacity:.38;filter:saturate(.5)}
.qd-backdrop,.qd-popup{transition:opacity .42s ease}
.qd-backdrop.coaching-fade{opacity:.10;pointer-events:none}
.qd-step-status{display:grid;gap:.55rem;margin-top:1rem}
.qd-step-status .step-button{width:100%}
.customer-row-faststart-pulse{animation:mentorPulse 1.2s ease both}
.own-account-title-badge.pulse{animation:mentorPulse 1.2s ease both}
@keyframes mentorPulse{0%{transform:scale(1)}35%{transform:scale(1.08);box-shadow:0 0 0 4px rgba(29,79,145,.34)}100%{transform:scale(1)}}
@keyframes customerArrive{0%{transform:translateY(8px);opacity:.25}100%{transform:translateY(0);opacity:1}}
.customer-row-arrive{animation:customerArrive .48s ease both}
.mentor-momentum-pulse{animation:momentumPulse 1s ease both}
@keyframes momentumPulse{0%{transform:scale(1)}35%{transform:scale(1.04);background:#c9edd7;box-shadow:0 0 0 3px rgba(20,122,74,.28)}100%{transform:scale(1)}}
.mentor-total-strip{margin-top:.85rem}
.notice-popup .compact-copy{margin:.35rem 0}
.notice-popup .key-line{font-weight:900;margin:.55rem 0}
@media(max-width:620px){.add-customer-solo{width:78%}.mentor-hero-grid{grid-template-columns:1fr 1fr;gap:.7rem}.mentor-side-stat span{font-size:.7rem}.hero-meta-pill,.own-account-title-badge{font-size:.68rem}}
</style>
</head>
<body class="mentor-journey">
<div class="app"><main class="shell" id="app"></main></div>
<script src="uw-earnings-rules.js"></script>
<script>
const R=window.UWEarningsRules;
const money=(value)=>`£${Math.round(value||0).toLocaleString()}`;
const startDate='2026-09-01';
const registerUrl='https://uw.partners/adrian.croft/partner/join';
const CONTACT={fullName:'Adrian Croft',photoUrl:'https://raw.githubusercontent.com/aqcroft/UW_PET_GH_v2/main/Adrian_Croft.jpg',whatsappNumber:'447787400800',whatsappMessage:"Hi Adrian, I've just used your mentor earnings explorer and I'd like to know more",email:'adrian.croft@uw.partners',emailSubject:'Your UW mentor earnings explorer',emailBody:"Hi Adrian, I've just used your mentor earnings explorer and I'd like to know more",phone:'+447787400800',calendarUrl:'https://tidycal.com/aqcroft/uwcost'};
const DEMO_TYPE='homeowner';
const DEMO_SERVICES=3;
const MENTOR_FAST_START_TOTAL=R.QD_MENTOR_BONUS+R.FAST_STARTER_MENTOR_BONUS;
const wait=(ms)=>new Promise(resolve=>window.setTimeout(resolve,ms));
const state={started:false,customers:[],introducedPartner:false,linkedOwnAccount:false,mentorBonusApplied:false,mentorBonusPulse:false,mentorPartnerBadgeApplied:false,mentorAccountBadgeApplied:false,mentorMilestonePulseId:null,mentorAccountPulse:false,qdModalFaded:false,qdBusy:false,qdComplete:false,firstFourBusy:false,lastAddedId:null,momentumIntroDismissed:false,momentumAppliedIds:[],momentumBusy:false,momentumPulseId:null,bonusPreview:null,month2HabReady:false,finalDismissed:false,expandedCustomerId:null,contactOpen:false,sayHiOpen:false,howPaidOpen:false};
function homeIcon(){return '🏡';}
function makeCustomer(number){return {id:`m${number}`,type:DEMO_TYPE,services:DEMO_SERVICES,supported:number<=5};}
function dateFor(number){return R.addDays(startDate,number<=5?number:30+number-5);}
function fastStartStepsComplete(){return state.introducedPartner&&state.linkedOwnAccount;}
function buildContext(){return {startDate,ownAccountQualifiesForFastStart:fastStartStepsComplete(),ownAccountDate:startDate,partnerIntroduced:fastStartStepsComplete(),introducedPartnerDate:R.addDays(startDate,19),gatheredCustomers:state.customers.map((customer,index)=>({...customer,dateGathered:dateFor(index+1),supported:index<5}))};}
function fullContext(){return {startDate,ownAccountQualifiesForFastStart:true,ownAccountDate:startDate,partnerIntroduced:true,introducedPartnerDate:R.addDays(startDate,19),gatheredCustomers:Array.from({length:10},(_,i)=>({id:`max${i+1}`,type:DEMO_TYPE,services:DEMO_SERVICES,supported:i<5,dateGathered:dateFor(i+1)}))};}
const maxResult=R.calculateEarnings(fullContext());
const maxMentorTotal=maxResult.recruiterBreakdown.total;
const maxMonth1Mentor=5*(R.CUSTOMER_BONUS_TABLE.homeowner[3]*0.5)+MENTOR_FAST_START_TOTAL;
const maxMonth2Mentor=5*R.MOMENTUM_RECRUITER_AMOUNT;
function visibleRow(row){const hasMomentum=row.momentumRecruiter>0,shown=state.momentumAppliedIds.includes(row.id);return hasMomentum&&!shown?{...row,momentumRecruiter:0,momentumGatheringPartner:0}:row;}
function splitMentor(result){const rows=result.customers.map(visibleRow),month1Rows=rows.filter(row=>row.customerNumber<=5),month2Rows=rows.filter(row=>row.customerNumber>5),supportTotal=month1Rows.reduce((sum,row)=>sum+row.supportingCustomerBonus,0),mentorFastStart=state.mentorBonusApplied?MENTOR_FAST_START_TOTAL:0,momentumTotal=month2Rows.reduce((sum,row)=>sum+row.momentumRecruiter,0),partnerFastStart=state.mentorBonusApplied?result.gatheringBreakdown.qdBonus+result.gatheringBreakdown.fastStarterBonus:0,partnerTotal=rows.reduce((sum,row)=>sum+row.customerBonusGatheringPartner+row.highActivityBonus+row.momentumGatheringPartner,0)+partnerFastStart,rowsById=rows.reduce((acc,row)=>{acc[row.id]=row;return acc;},{});return {rows,rowsById,month1:supportTotal+mentorFastStart,month2:momentumTotal,supportTotal,mentorFastStart,momentumTotal,total:supportTotal+mentorFastStart+momentumTotal,partnerTotal};}
function addOneCustomer(){if(state.customers.length>=10)return null;const customer=makeCustomer(state.customers.length+1);state.customers.push(customer);state.lastAddedId=customer.id;render();return customer;}
async function supportFirstFour(){if(state.firstFourBusy||state.customers.length!==0)return;state.firstFourBusy=true;for(let i=0;i<4;i++){addOneCustomer();await wait(650);state.lastAddedId=null;render();}state.firstFourBusy=false;render();}
async function supportFifth(){if(state.customers.length!==4)return;addOneCustomer();await wait(650);state.lastAddedId=null;render();}
async function completeFastStartStep(step){if(state.qdBusy||state.qdComplete)return;if(step==='partner'&&state.introducedPartner)return;if(step==='own'&&state.linkedOwnAccount)return;state.qdBusy=true;state.qdModalFaded=true;render();await wait(520);if(step==='partner'){state.introducedPartner=true;state.mentorPartnerBadgeApplied=true;state.mentorMilestonePulseId='m3';}else{state.linkedOwnAccount=true;state.mentorAccountBadgeApplied=true;state.mentorAccountPulse=true;}render();await wait(1450);state.mentorMilestonePulseId=null;state.mentorAccountPulse=false;state.qdModalFaded=false;state.qdBusy=false;render();if(fastStartStepsComplete()){await wait(650);state.qdBusy=true;state.qdModalFaded=true;render();await wait(520);state.mentorBonusApplied=true;state.mentorBonusPulse=true;render();await wait(1450);state.mentorBonusPulse=false;state.qdComplete=true;state.qdBusy=false;state.qdModalFaded=false;render();}}
async function buildMomentumFour(){if(state.momentumBusy||state.momentumIntroDismissed)return;state.momentumIntroDismissed=true;state.momentumBusy=true;render();for(let n=6;n<=9;n++){const c=addOneCustomer();await wait(380);state.bonusPreview={id:c.id,amount:R.MOMENTUM_RECRUITER_AMOUNT};render();await wait(520);state.bonusPreview=null;if(!state.momentumAppliedIds.includes(c.id))state.momentumAppliedIds.push(c.id);state.momentumPulseId=c.id;render();await wait(780);state.momentumPulseId=null;state.lastAddedId=null;render();await wait(180);}state.momentumBusy=false;state.month2HabReady=true;render();}
async function addFinalCustomer(){if(state.momentumBusy||state.customers.length!==9)return;state.month2HabReady=false;state.momentumBusy=true;render();const c=addOneCustomer();await wait(380);state.bonusPreview={id:c.id,amount:R.MOMENTUM_RECRUITER_AMOUNT};render();await wait(520);state.bonusPreview=null;state.momentumAppliedIds.push(c.id);state.momentumPulseId=c.id;render();await wait(900);state.momentumPulseId=null;state.lastAddedId=null;state.momentumBusy=false;render();}
function resetExplorer(){Object.assign(state,{started:true,customers:[],introducedPartner:false,linkedOwnAccount:false,mentorBonusApplied:false,mentorBonusPulse:false,mentorPartnerBadgeApplied:false,mentorAccountBadgeApplied:false,mentorMilestonePulseId:null,mentorAccountPulse:false,qdModalFaded:false,qdBusy:false,qdComplete:false,firstFourBusy:false,lastAddedId:null,momentumIntroDismissed:false,momentumAppliedIds:[],momentumBusy:false,momentumPulseId:null,bonusPreview:null,month2HabReady:false,finalDismissed:false,expandedCustomerId:null});render();}
function dismissFinal(){state.finalDismissed=true;render();}
function start(){state.started=true;render();}
function toggleCustomerDetails(id){state.expandedCustomerId=state.expandedCustomerId===id?null:id;render();}
function ordinal(n){const suffix=n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th';return `${n}${suffix}`;}
function whatsappUrl(){return `https://wa.me/${CONTACT.whatsappNumber}?text=${encodeURIComponent(CONTACT.whatsappMessage)}`;}
function emailUrl(){return `mailto:${CONTACT.email}?subject=${encodeURIComponent(CONTACT.emailSubject)}&body=${encodeURIComponent(CONTACT.emailBody)}`;}
function phoneUrl(){return `tel:${CONTACT.phone}`;}
function toggleContact(){state.contactOpen=!state.contactOpen;if(!state.contactOpen)state.sayHiOpen=false;render();}
function toggleSayHi(){state.sayHiOpen=!state.sayHiOpen;render();}
function openHowPaid(){state.howPaidOpen=true;state.contactOpen=false;state.sayHiOpen=false;render();}
function closeHowPaid(){state.howPaidOpen=false;render();}
function contactMarkup(){return `<div class="profile-bubble-wrap"><button class="profile-photo-btn" onclick="toggleContact()" aria-label="${state.contactOpen?'Close contact menu':'Open contact menu'}"><img src="${CONTACT.photoUrl}" alt="${CONTACT.fullName}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="initials">AC</span></button><div class="fab-actions ${state.contactOpen?'open':''}"><a href="${registerUrl}" target="_blank" rel="noopener" class="fab-action-btn fab-btn-jumpin"><span>🔥</span><strong>Jump in</strong></a><a href="${CONTACT.calendarUrl}" target="_blank" rel="noopener" class="fab-action-btn fab-btn-bookin"><span>🗓️</span><strong>Book in</strong></a><button class="fab-action-btn fab-btn-curious" onclick="openHowPaid()"><span>🔍</span><strong>Curious?</strong></button><button class="fab-action-btn fab-btn-sayhi" onclick="toggleSayHi()"><span>👋</span><strong>Say hi</strong></button><div class="sayhi-icons-row ${state.sayHiOpen?'open':''}"><a class="fab-icon-circle" href="${whatsappUrl()}" target="_blank" rel="noopener">☎</a><a class="fab-icon-circle" href="${emailUrl()}">✉</a><a class="fab-icon-circle" href="${phoneUrl()}">☏</a></div></div></div>`;}
function paidSection(title,summary,detail,icon,tone){return `<details class="paid-section paid-section-${tone}"><summary><span>${icon}</span><strong>${title}</strong></summary><p>${summary}</p><div>${detail}</div></details>`;}
function howPaidMarkup(){if(!state.howPaidOpen)return '';return `<div class="notice-backdrop howpaid-overlay" onclick="closeHowPaid()"><section class="howpaid-panel" onclick="event.stopPropagation()"><div class="howpaid-head"><div><div class="eyebrow">Mentor story</div><h2>How the mentor income works</h2></div><button class="sheet-close" onclick="closeHowPaid()">×</button></div><div class="howpaid-note">This follows on from the First 60 Days journey and focuses on what changes when you help one new Partner through theirs.</div><div class="paid-list">${paidSection('Supporting Customer Bonus','You actively support their early appointments.','<p>This demo uses 3-service homeowners, producing £125 mentor support income per eligible supported appointment.</p>','🤝','purple')}${paidSection('Fast Start Mentor','Help your new Partner reach QD* in their first 30 days.','<p>In this journey, upgrading one customer to Partner and linking their own account completes the QD* picture and unlocks the £400 mentor moment.</p>','🎓','slate')}${paidSection('Mentor Momentum','In days 31-60, support steps back and Momentum takes over.','<p>Eligible unsupported 3+ service customers pay £125 to the new Partner and £125 to the mentor.</p>','🎓⚡','green')}</div></section></div>`;}
function assumptionsTip(){return `<details class="assumption-tip"><summary>ⓘ Assumptions</summary><p>This is illustrative. It follows one new Partner through ten 3-service homeowners, assumes their first five appointments are actively supported, QD* is achieved in their first 30 days, and customers 6-10 are eligible unsupported appointments in days 31-60.</p></details>`;}
function detailCell(label,value){return `<div class="detail-cell"><span>${label}</span><strong>${money(value)}</strong></div>`;}
function rowBadge(label,tone='',iconOnly=false,title=''){return `<span class="row-badge ${tone} ${iconOnly?'icon-only':''}" ${title?`title="${title}" aria-label="${title}"`:''}>${label}</span>`;}
function bonusPreviewFor(row){return row&&state.bonusPreview&&state.bonusPreview.id===row.id?`<span class="bonus-preview momentum">+${money(state.bonusPreview.amount).slice(1)}</span>`:'';}
function tableMoney(value,extraClass=''){return `<strong class="table-money ${extraClass}">${money(value)}</strong>`;}
function renderMentorRows(customers,rowsById,offset=0,lockedFuture=false){return Array.from({length:5},(_,i)=>{const number=offset+i+1,c=customers[i],row=c&&rowsById[c.id],future=lockedFuture&&!row,isFirstPeriod=offset<5,support=row?row.supportingCustomerBonus:0,momentum=row?row.momentumRecruiter:0,total=support+momentum,cls=['customer-icon',isFirstPeriod?'period-first':'period-next',row?'filled':future?'future-window':''].filter(Boolean).join(' '),partnerAwarded=row&&number===3&&state.mentorPartnerBadgeApplied,badges=[support>0?rowBadge('🤝','support',true,'Supporting bonus'):'',momentum>0?rowBadge('🎓⚡','momentum',true,'Mentor Momentum'):'',partnerAwarded?rowBadge('🏅 Partner','partner',false):''].filter(Boolean).join(''),expanded=row&&state.expandedCustomerId===row.id,pulseClass=row&&state.momentumPulseId===row.id?'mentor-momentum-pulse':row&&state.mentorMilestonePulseId===row.id?'customer-row-faststart-pulse':'',arrive=row&&state.lastAddedId===row.id?'customer-row-arrive':'';return `<div class="customer-table-row ${future?'customer-tile-future':''} ${partnerAwarded?'customer-tile-awarded':''} ${pulseClass} ${arrive}" aria-label="${ordinal(number)} customer">${row?`<button class="customer-summary-row" onclick="toggleCustomerDetails('${row.id}')" aria-expanded="${expanded?'true':'false'}"><div class="customer-row-id"><div class="${cls}">${homeIcon()}</div><strong>${number}</strong></div><div class="row-badges">${badges}</div><div class="table-total-stack">${bonusPreviewFor(row)}${tableMoney(total,'table-row-total')}</div></button>`:`<div class="customer-summary-row empty"><div class="customer-row-id"><div class="${cls}">+</div><strong>${number}</strong></div><div class="row-badges"></div><div class="table-total-stack">${tableMoney(0,'table-row-total')}</div></div>`}${expanded?`<div class="customer-row-detail ${isFirstPeriod?'customer-row-detail-compact':''}">${detailCell('🤝 Supporting',support)}${!isFirstPeriod?detailCell('🎓⚡ Momentum',momentum):''}${detailCell('💷 Their earnings',row.customerBonusGatheringPartner+row.highActivityBonus+row.momentumGatheringPartner)}</div>`:''}</div>`;}).join('');}
function mentorColumn({title,count,total,max,rows,tone,ghost=''}){return `<section class="customer-column customer-column-${tone} ${ghost==='future'?'column-ghost-future':ghost==='complete'?'column-ghost-complete':''}"><div class="customer-column-head"><div class="column-head-left"><div class="eyebrow column-phase-title">${title}</div><span class="column-count">${homeIcon()} ${count}/5</span></div><strong class="column-total-blob">${money(total)}</strong></div><div class="progress"><span style="width:${Math.min(100,total/max*100)}%"></span></div><div class="customer-earnings-table"><div class="customer-table-head"><span>Customer</span><span>Bonus</span><span>Total</span></div>${rows}</div></section>`;}
function fastStartStepButton(done,label,step){const icon=step==='own'?'🔗':'🏅';return `<button class="step-button ${done?'done':''}" ${done||state.qdBusy?'disabled':''} onclick="completeFastStartStep('${step}')"><span>${done?'Done':'Tap to apply'}</span><strong><span class="step-main-icon">${icon}</span>${label}</strong><span class="step-check">${done?'✓':''}</span></button>`;}
function mentorTitleOwnAccountBadge(){const active=state.mentorAccountBadgeApplied;return `<span class="own-account-title-badge mentor-account-badge ${active?'':'ghost'} ${state.mentorAccountPulse?'pulse':''}">🔗 Linking their own account</span>`;}
function celebrationGlitter(){return `<div class="celebration-glitter" aria-hidden="true">${Array.from({length:30},(_,i)=>`<span style="--x:${(i*41)%100}%;--d:${(i%8)*.08}s;--s:${.78+(i%7)*.08};--r:${(i*31)%360}deg">✨</span>`).join('')}</div>`;}
function qdModal(){if(state.customers.length!==5||state.qdComplete)return '';return `<div class="notice-backdrop qd-backdrop ${state.qdModalFaded?'coaching-fade':''}"><section class="notice-popup notice-blue notice-celebration qd-popup" onclick="event.stopPropagation()"><div class="notice-emoji">🎯</div><div class="eyebrow">Fast Start Mentor Bonus</div><h2>Helping them reach QD*</h2><p class="muted">When achieved in their first 30 days, you earn a <strong>£400 bonus</strong>.</p><div class="qd-step-status">${fastStartStepButton(state.introducedPartner,'Upgrading 1 customer to Partner','partner')}${fastStartStepButton(state.linkedOwnAccount,'Linking their own account','own')}</div></section></div>`;}
function momentumIntroModal(){if(!state.qdComplete||state.momentumIntroDismissed)return '';return `<div class="notice-backdrop"><section class="notice-popup notice-green notice-celebration" onclick="event.stopPropagation()">${celebrationGlitter()}<div class="notice-emoji">🎓⚡</div><div class="eyebrow milestone-heading">Mentor Momentum begins</div><p class="compact-copy">In days 31-60, supporting bonuses are replaced with Momentum bonuses.</p><p class="compact-copy">These reward <strong>3+ service customers from unsupported appointments</strong>.</p><p class="key-line">Both the new Partner and the mentor are paid £125.</p><p class="muted">That's up to <strong>£500</strong> for their next four customers.</p><button class="button green" onclick="buildMomentumFour()">See Mentor Momentum build</button></section></div>`;}
function habReminderModal(){if(!state.month2HabReady)return '';return `<div class="notice-backdrop"><section class="notice-popup notice-hab notice-celebration" onclick="event.stopPropagation()"><div class="notice-emoji">🔥</div><div class="eyebrow milestone-heading">High Activity Bonus again</div><h2>Their bonuses now stack.</h2><p class="muted">Their fourth 3-service homeowner this month means High Activity Bonus applies across all four.</p><p class="key-line">Your new Partner is now earning High Activity Bonus and Momentum together.</p><button class="button green" onclick="addFinalCustomer()">Add their 10th customer 🏡</button></section></div>`;}
function finalModal(split){if(state.customers.length<10||state.momentumBusy||state.finalDismissed)return '';const registerButton=`<a class="button blue register-link tall-action" target="_blank" rel="noopener" href="${registerUrl}"><span>🎯 Ready to earn? Register here!</span><small>(new tab)</small></a>`,chatButton=`<a class="button secondary register-link tall-action" target="_blank" rel="noopener" href="${CONTACT.calendarUrl}"><span>🗓️ Got questions? Book a chat</span><small>(new tab)</small></a>`;return `<div class="notice-backdrop"><section class="notice-popup notice-green notice-celebration notice-final" onclick="event.stopPropagation()">${celebrationGlitter()}<button class="notice-close" onclick="dismissFinal()" aria-label="Close">×</button><div class="notice-emoji">🚀</div><div class="eyebrow">Mentor Journey Complete</div><h2>${money(split.total)} mentor income</h2><p class="muted">You helped one new Partner earn <strong>${money(split.partnerTotal)}</strong> across this 60-day example<br>and earned <strong>${money(split.total)}</strong> yourself.</p><p class="muted"><strong>That's just one Partner.</strong> What if you mentored two whilst continuing to gather your own customers?</p><div class="mentor-total-strip"><div class="mentor-total-chip"><span>🤝 Supporting</span><strong>${money(split.supportTotal)}</strong></div><div class="mentor-total-chip"><span>🏆🎓 Fast Start Mentor</span><strong>${money(split.mentorFastStart)}</strong></div><div class="mentor-total-chip"><span>🎓⚡ Mentor Momentum</span><strong>${money(split.momentumTotal)}</strong></div></div><div class="notice-actions notice-actions-stacked">${registerButton}${chatButton}<div class="or-divider">OR</div><button class="button secondary tall-action" onclick="dismissFinal()"><span>🔍 Continue to explore</span></button></div></section></div>`;}
function renderStarted(){const result=R.calculateEarnings(buildContext()),split=splitMentor(result),count=state.customers.length,month1Count=Math.min(5,count),month2Count=Math.max(0,count-5),goGreen=state.qdComplete,leftGhost=goGreen&&count<10?'complete':'',rightGhost=goGreen?'':'future',bonusBadge=(ico,word,val,tone,pulse=false)=>`<div class="bonus-badge bonus-${tone}${val>0?'':' ghost'}${pulse?' pulse':''}"><span class="bonus-ico">${ico}</span><span class="bonus-word">${word}</span><strong class="bonus-sub">${money(val)}</strong></div>`,bonusesRow=`<div class="bonuses-row"><div class="bonus-group">${bonusBadge('🤝','Supporting',split.supportTotal,'support')}${bonusBadge('🎓','Mentor',split.mentorFastStart,'mentor',state.mentorBonusPulse)}</div><div class="bonus-group">${bonusBadge('⚡','Momentum',split.momentumTotal,'mentormom')}</div></div>`;let action='';if(count===0)action=`<button class="button blue add-customer-main add-customer-solo" ${state.firstFourBusy?'disabled':''} onclick="supportFirstFour()"><span class="add-label-text"><span class="add-label-main">Support their first 4</span><span class="add-label-sub">customers</span></span><span class="add-label-icon">🤝</span></button>`;else if(count===4)action=`<button class="button blue add-customer-main add-customer-solo" onclick="supportFifth()"><span class="add-label-text"><span class="add-label-main">Support their 5th</span><span class="add-label-sub">customer</span></span><span class="add-label-icon">${homeIcon()}</span></button>`;const actionRail=action?`<div class="add-customer-solo-row">${action}</div>`:'';document.body.classList.toggle('explorer-independent',goGreen);document.getElementById('app').innerHTML=`${contactMarkup()}<header class="topbar"><div><div class="eyebrow">Utility Warehouse Mentor Earnings Explorer <span style="opacity:.55">v2</span></div></div></header><section class="hero ${goGreen?'hero-independent':'hero-tracker-first'}"><div class="mentor-hero-grid"><div><div class="eyebrow" style="color:rgba(255,255,255,.76)">Your mentor income</div><div class="hero-number">${money(split.total)}</div></div><div class="mentor-hero-right"><div class="mentor-side-stat"><span>Your new Partner earns</span><strong>${money(split.partnerTotal)}</strong></div><div class="hero-meta-stack"><div class="hero-meta-pill"><span class="hero-house">${homeIcon()}</span><span>${DEMO_SERVICES} service homeowners</span></div>${mentorTitleOwnAccountBadge()}</div></div></div><div style="margin-top:.75rem" class="progress"><span style="width:${Math.min(100,split.total/maxMentorTotal*100)}%"></span></div><div class="hero-progress-caption">${money(split.total)} of ${money(maxMentorTotal)} mentor income</div></section><section class="card customer-builder-card ${goGreen?'independence-card':''}">${bonusesRow}<div class="customer-columns">${mentorColumn({title:'Their days 1-30',count:month1Count,total:split.month1,max:maxMonth1Mentor,rows:renderMentorRows(state.customers.slice(0,5),split.rowsById,0,false),tone:'first',ghost:leftGhost})}${mentorColumn({title:'Their days 31-60',count:month2Count,total:split.month2,max:maxMonth2Mentor,rows:renderMentorRows(state.customers.slice(5),split.rowsById,5,!goGreen),tone:'next',ghost:rightGhost})}</div>${actionRail}</section><div class="utility-row">${assumptionsTip()}<button class="button secondary button-small" onclick="resetExplorer()">Start again</button></div>${qdModal()}${momentumIntroModal()}${habReminderModal()}${finalModal(split)}${howPaidMarkup()}`;}
function renderWelcome(){document.body.classList.remove('explorer-independent');document.getElementById('app').innerHTML=`${contactMarkup()}<section class="splash-card" style="margin-top:10vh"><div class="splash-top"><div class="splash-wave">🤝</div><h1>Welcome to the Utility Warehouse mentor earnings explorer</h1></div><div class="splash-body"><div class="splash-highlight">You've seen how your own first 60 days can build.<br>Now see what happens when you help one new Partner through theirs.</div><p>This shorter follow-on journey focuses on the three mentor income moments:</p><div class="income-chip-grid"><div class="income-chip"><span>🤝</span><strong>Supporting bonuses</strong><em>early appointments</em></div><div class="income-chip"><span>🎓</span><strong>Fast Start Mentor</strong><em>£400 milestone</em></div><div class="income-chip"><span>🎓⚡</span><strong>Mentor Momentum</strong><em>days 31-60</em></div></div><p><strong>The more you support and coach your new Partners, the more you can succeed too. 🏆</strong></p><button class="button splash-start" onclick="start()">Let's go!</button></div></section>${howPaidMarkup()}`;}
function render(){state.started?renderStarted():renderWelcome();}
render();
</script>
</body>
</html>
